<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talenthree — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --ink:#0A0A0A; --white:#FFFFFF; --off:#F2F2F0; --rule:#E2E2E0;
  --mid:#888888; --light:#BBBBBB; --gold:#AD8A4E; --gold-tint:#F7F1E4;
  --red:#B23B3B; --red-tint:#FBEEEE;
}
html,body{height:100%;}
body{
  background:var(--off); color:var(--ink); font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; min-height:100dvh; padding:24px;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;}

.card{
  width:100%; max-width:380px;
  background:var(--white); border:1px solid var(--rule); border-radius:18px;
  padding:40px 32px 32px; text-align:center;
  box-shadow:0 24px 60px -24px rgba(10,10,10,0.14);
}
.logo{display:flex; align-items:center; justify-content:center; gap:9px; margin-bottom:28px;}
.logo svg{width:24px;height:24px;}
.logo-word{font-size:17px;font-weight:800;letter-spacing:-.03em;}

.title{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px;}
.sub{font-size:13px;color:var(--mid);line-height:1.5;margin-bottom:32px;}

.g-btn{
  width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
  border:1px solid var(--rule); border-radius:10px; padding:13px;
  font-size:14px; font-weight:700; color:var(--ink); background:var(--white);
  transition:background .15s, border-color .15s;
}
.g-btn:hover{background:var(--off); border-color:var(--light);}
.g-btn svg{width:18px;height:18px;flex-shrink:0;}

.status{
  margin-top:18px; font-size:12.5px; color:var(--mid); min-height:16px;
}
.status.err{color:var(--red);}

.legal{
  margin-top:28px; font-size:11px; color:var(--light); line-height:1.5;
}
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <svg viewBox="0 0 26 26" fill="none">
      <circle cx="13" cy="5" r="3" fill="#0A0A0A"/>
      <circle cx="5" cy="20" r="3" fill="#0A0A0A"/>
      <circle cx="21" cy="20" r="3" fill="#0A0A0A"/>
      <line x1="13" y1="5" x2="5" y2="20" stroke="#0A0A0A" stroke-width="1.5" stroke-opacity=".2"/>
      <line x1="13" y1="5" x2="21" y2="20" stroke="#0A0A0A" stroke-width="1.5" stroke-opacity=".2"/>
      <line x1="5" y1="20" x2="21" y2="20" stroke="#0A0A0A" stroke-width="1.5" stroke-opacity=".2"/>
    </svg>
    <div class="logo-word">Talenthree</div>
  </div>

  <div class="title">Sign in to continue</div>
  <div class="sub">Use your work Google account to access bookings, tracking, and your team's stands.</div>

  <button class="g-btn" onclick="signIn()">
    <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.4 0 10.3-2.1 14-5.5l-6.5-5.4C29.4 34.8 26.8 36 24 36c-5.2 0-9.6-3.3-11.2-8l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4 5.7l6.5 5.4C39.9 36.5 44 31 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
    Continue with Google
  </button>

  <div class="status" id="status"></div>

  <div class="legal">By signing in, you agree this account is used only for authorized Talenthree field operations.</div>
</div>

<script type="module">
const SUPABASE_URL = 'https://mgvamaqdsiqjfzydwvog.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ACOTx5HfUniaOdZDWiMmag_TuiRiycO';

const statusEl = document.getElementById('status');
const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');

if (!SUPABASE_URL.startsWith('http')) {
  statusEl.textContent = 'Not configured yet — add SUPABASE_URL / SUPABASE_ANON_KEY in this page.';
  statusEl.classList.add('err');
} else {
  window.supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Already signed in? Skip straight to the app.
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    window.location.href = './index.html';
  }
}

window.signIn = async function () {
  if (!window.supabase) return;
  statusEl.textContent = 'Redirecting to Google…';
  statusEl.classList.remove('err');
  const { error } = await supabase.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + window.location.pathname.replace('login.html','index.html') }
  });
  if (error) {
    statusEl.textContent = 'Sign-in failed: ' + error.message;
    statusEl.classList.add('err');
  }
};
</script>
</body>
</html>
